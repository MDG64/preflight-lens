<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Même règle que les autres pages (2026-08-27) : pas de référencement tant
     que l'app n'est pas sur les stores. fiches.html l'avait manqué et restait
     la SEULE page indexable du site — l'inverse de l'intention. Outil interne
     de surcroît : celle-ci n'a pas vocation à être référencée même après. -->
<meta name="robots" content="noindex, nofollow">
<title>Fiches approche</title>
<!-- ============================================================
  fiches.html — déposer une fiche d'approche photographiée dans
  OneDrive\Documents\Fiches approche, depuis le téléphone.

  Le trajet : la photo part vers le proxy Railway (POST /api/fiches,
  volume persistant), et c'est le PC qui la tire dans le dossier OneDrive
  toutes les dix minutes (aero-db/tirer-fiches.js) avant de la supprimer
  du relais. Pas de compte, pas d'OAuth : un compte Microsoft personnel
  ne peut pas déclarer d'application (tenant grand public), la voie
  Graph est donc fermée sans abonnement Azure — constat du 2026-08-14.

  Le jeton (FICHES_TOKEN, le même que sur Railway) se colle une fois à
  la première ouverture et vit dans localStorage. Il voyage en en-tête,
  jamais dans l'URL.
  ============================================================ -->
<link rel="manifest" href="fiches.webmanifest">
<!-- Annuaire compact OACI/IATA (généré par Tools/build-annuaire.js) : nourrit
     l'autocomplétion du champ terrain. S'il manque (hors ligne, première
     visite), le champ fonctionne comme avant, sans propositions. -->
<script src="annuaire-terrains.js" defer></script>
<link rel="icon" href="fiches-icon-192-v1.png">
<link rel="apple-touch-icon" href="fiches-icon-180-v1.png">
<meta name="theme-color" content="#16324f">
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('fonts/ibm-plex-sans-v23-latin-wght.woff2') format('woff2');
    font-weight: 100 700; font-display: swap;
  }
  :root {
    --fond: #0d1117; --carte: #161b26; --bord: #2b3444;
    --texte: #e6e8ee; --sourd: #9aa4b2;
    --accent: #2f81f7; --ok: #2ea06c; --alerte: #d4544a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fond); color: var(--texte);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; }
  header img { width: 34px; height: 34px; border-radius: 8px; }
  header h1 { font-size: 19px; font-weight: 600; flex: 1; }
  header button { background: none; border: none; color: var(--sourd); font-size: 20px; padding: 6px; cursor: pointer; }
  main { flex: 1; display: flex; flex-direction: column; }
  .ecran { display: none; flex: 1; flex-direction: column; gap: 14px; }
  .ecran.actif { display: flex; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 16px; }
  p.note { color: var(--sourd); font-size: 14px; line-height: 1.45; }
  label { font-size: 13px; color: var(--sourd); display: block; margin-bottom: 5px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--bord);
    background: var(--fond); color: var(--texte); font-size: 16px;
    font-family: inherit;
  }
  input.icao { text-transform: uppercase; letter-spacing: .2em; font-size: 20px; text-align: center; }
  .champ-terrain { position: relative; }
  .propositions {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
    background: var(--carte); border: 1px solid var(--bord); border-radius: 10px;
    overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .propositions button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--bord);
    padding: 11px 13px; color: var(--texte); font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .propositions button:last-child { border-bottom: 0; }
  .propositions .p-oaci { font-weight: 600; letter-spacing: .12em; color: var(--accent); }
  .propositions .p-iata {
    font-size: 11px; letter-spacing: .06em; color: var(--sourd);
    border: 1px solid var(--bord); border-radius: 4px; padding: 2px 5px;
  }
  .propositions .p-lieu { color: var(--sourd); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.principal {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  button.principal:disabled { opacity: .5; }
  button.discret {
    width: 100%; padding: 13px; border-radius: 12px; font-family: inherit;
    background: none; border: 1px solid var(--bord); color: var(--texte); font-size: 15px; cursor: pointer;
  }
  button.camera {
    width: 100%; padding: 34px 16px; border: 2px dashed var(--bord); border-radius: 16px;
    background: var(--carte); color: var(--texte); font-size: 18px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  button.camera span { display: block; font-size: 42px; margin-bottom: 8px; }
  .apercu-photo { width: 100%; border-radius: 12px; border: 1px solid var(--bord); max-height: 52vh; object-fit: contain; background: #000; }
  .barre { height: 10px; border-radius: 5px; background: var(--bord); overflow: hidden; }
  .barre > div { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  .succes { color: var(--ok); font-size: 17px; font-weight: 600; }
  .erreur { background: #3a1f1f; border: 1px solid var(--alerte); border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.4; display: none; }
  .erreur.actif { display: block; }
  ul.journal { list-style: none; font-size: 13px; color: var(--sourd); display: flex; flex-direction: column; gap: 4px; }
  ul.journal li::before { content: '✓ '; color: var(--ok); }
  footer { text-align: center; color: var(--sourd); font-size: 12px; padding-top: 12px; }
  .pile { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
</style>
</head>
<body>
<header>
  <img src="fiches-icon-192-v1.png" alt="">
  <h1>Fiches approche</h1>
  <button id="btn-reglages" title="Réglages" aria-label="Réglages">⚙</button>
</header>
<main>

  <!-- Première ouverture : le jeton, saisi une fois. -->
  <section class="ecran" id="ecran-config">
    <div class="carte">
      <p class="note">Colle ici le <b>jeton de dépôt</b> (le même que la
      variable <b>FICHES_TOKEN</b> du serveur). À faire une seule fois sur
      cet appareil.</p>
    </div>
    <div>
      <label for="cfg-jeton">Jeton de dépôt</label>
      <input type="password" id="cfg-jeton" autocomplete="off" spellcheck="false">
    </div>
    <div>
      <label for="cfg-serveur">Serveur relais (laisser tel quel, sauf test)</label>
      <input type="text" id="cfg-serveur" placeholder="https://notam-proxy-production.up.railway.app" autocomplete="off" spellcheck="false">
    </div>
    <div class="erreur" id="err-config"></div>
    <div class="pile">
      <button class="principal" id="btn-config">Enregistrer</button>
    </div>
  </section>

  <!-- L'écran de tous les jours : ouvrir la caméra. -->
  <section class="ecran" id="ecran-principal">
    <button class="camera" id="btn-camera"><span>📷</span>Photographier une fiche</button>
    <div class="champ-terrain">
      <label for="icao">Terrain (OACI ou IATA, facultatif — nomme le fichier)</label>
      <input type="text" id="icao" class="icao" maxlength="4" placeholder="LFBO" autocomplete="off" spellcheck="false">
      <div class="propositions" id="propositions" hidden></div>
    </div>
    <div class="erreur" id="err-principal"></div>
    <ul class="journal" id="journal"></ul>
    <!-- capture="environment" ouvre directement la caméra arrière sur
         téléphone ; sur un ordinateur, l'attribut est ignoré et un
         sélecteur de fichier apparaît — les deux conviennent. -->
    <input type="file" id="fichier" accept="image/*" capture="environment" hidden>
  </section>

  <!-- La confirmation demandée : on voit ce qu'on envoie. -->
  <section class="ecran" id="ecran-apercu">
    <img class="apercu-photo" id="apercu" alt="Aperçu de la fiche">
    <p class="note" id="apercu-detail"></p>
    <div class="erreur" id="err-apercu"></div>
    <div class="pile">
      <button class="principal" id="btn-envoyer">✓ Envoyer dans le dossier</button>
      <button class="discret" id="btn-reprendre">↺ Reprendre la photo</button>
    </div>
  </section>

  <!-- L'envoi. -->
  <section class="ecran" id="ecran-envoi">
    <div class="carte">
      <p class="note" id="envoi-detail">Envoi…</p>
    </div>
    <div class="barre"><div id="progression"></div></div>
  </section>

  <!-- C'est fait. -->
  <section class="ecran" id="ecran-fait">
    <div class="carte">
      <p class="succes">✓ Fiche déposée</p>
      <p class="note" id="fait-detail"></p>
    </div>
    <div class="pile">
      <button class="principal" id="btn-encore">📷 Photographier la suivante</button>
    </div>
  </section>

</main>
<footer id="pied"></footer>

<script>
'use strict';
/* ---------- configuration locale ---------- */
const SERVEUR_DEFAUT = 'https://notam-proxy-production.up.railway.app';
const CFG = {
  get jeton() { return localStorage.getItem('fa_jeton') || ''; },
  set jeton(v) { localStorage.setItem('fa_jeton', v); },
  get serveur() { return localStorage.getItem('fa_serveur') || SERVEUR_DEFAUT; },
  set serveur(v) { localStorage.setItem('fa_serveur', v); }
};

const $ = id => document.getElementById(id);
const ecrans = [...document.querySelectorAll('.ecran')];
function montrer(id) {
  ecrans.forEach(e => e.classList.toggle('actif', e.id === id));
  document.querySelectorAll('.erreur').forEach(e => e.classList.remove('actif'));
}
function erreur(id, msg) {
  const e = $(id); e.textContent = msg; e.classList.add('actif');
}

/* ---------- démarrage ---------- */
function demarrer() {
  $('pied').textContent = 'v2.2 · relais ' + CFG.serveur.replace(/^https?:\/\//, '');
  // Le serveur par défaut se montre dès la première ouverture : un champ
  // vide faisait croire qu'il y avait quelque chose à trouver soi-même.
  $('cfg-serveur').value = CFG.serveur;
  montrer(CFG.jeton ? 'ecran-principal' : 'ecran-config');
}

/* ---------- écrans ---------- */
$('btn-config').onclick = () => {
  const jeton = $('cfg-jeton').value.trim();
  const serveur = $('cfg-serveur').value.trim().replace(/\/+$/, '') || SERVEUR_DEFAUT;
  if (jeton.length < 16) { erreur('err-config', 'Ce jeton est trop court pour être le bon (au moins 16 caractères).'); return; }
  if (!/^https?:\/\//.test(serveur)) { erreur('err-config', 'Le serveur doit commencer par https://'); return; }
  CFG.jeton = jeton; CFG.serveur = serveur;
  demarrer();
};

$('btn-reglages').onclick = () => {
  $('cfg-jeton').value = CFG.jeton;
  $('cfg-serveur').value = CFG.serveur;
  montrer('ecran-config');
};

/* ---------- prise de vue et confirmation ---------- */
let photo = null;     // le Blob en attente d'envoi
$('btn-camera').onclick = () => $('fichier').click();
$('fichier').onchange = () => {
  const f = $('fichier').files[0];
  if (!f) return;
  photo = f;
  $('apercu').src = URL.createObjectURL(f);
  $('apercu-detail').textContent =
    `${nomDeFichier(f)} · ${(f.size / 1048576).toFixed(1)} Mo`;
  montrer('ecran-apercu');
  $('fichier').value = '';   // permet de reprendre la même fiche
};
$('btn-reprendre').onclick = () => { photo = null; montrer('ecran-principal'); $('btn-camera').click(); };
$('btn-encore').onclick = () => { montrer('ecran-principal'); $('btn-camera').click(); };

/* ---------- autocomplétion du terrain (annuaire OACI/IATA) ----------
   L'annuaire compact (annuaire-terrains.js, généré depuis la base de l'app
   principale) se découpe à la première frappe. Propositions dès 2 lettres :
   préfixe OACI ou préfixe IATA ; le choix insère toujours le code OACI. */
let terrains = null, parIata = null;
function chargerAnnuaire() {
  if (terrains) return true;
  if (!window.ANNUAIRE_TERRAINS) return false;
  terrains = []; parIata = {};
  for (const ligne of window.ANNUAIRE_TERRAINS.split('\n')) {
    const [oaci, iata, ville, pays] = ligne.split('|');
    if (!oaci) continue;
    const t = { oaci, iata: iata || '', ville: ville || '', pays: pays || '' };
    terrains.push(t);
    if (t.iata && !parIata[t.iata]) parIata[t.iata] = oaci;
  }
  return true;
}
function proposer(q) {
  if (q.length < 2 || !chargerAnnuaire()) return [];
  const res = [];
  for (const t of terrains) {
    let rang = -1;
    if (t.iata === q) rang = 0;
    else if (t.oaci.startsWith(q)) rang = 1;
    else if (q.length <= 3 && t.iata && t.iata.startsWith(q)) rang = 2;
    if (rang >= 0) res.push({ rang, t });
  }
  res.sort((a, b) => a.rang - b.rang || (a.t.oaci < b.t.oaci ? -1 : 1));
  return res.slice(0, 8).map(r => r.t);
}
const champIcao = $('icao'), boite = $('propositions');
function fermerPropositions() { boite.hidden = true; boite.innerHTML = ''; }
champIcao.addEventListener('input', () => {
  const q = champIcao.value.trim().toUpperCase();
  const liste = proposer(q);
  if (!liste.length) { fermerPropositions(); return; }
  boite.innerHTML = liste.map(t => `<button type="button" data-oaci="${t.oaci}">
    <span class="p-oaci">${t.oaci}</span>${t.iata ? `<span class="p-iata">${t.iata}</span>` : ''}
    <span class="p-lieu">${t.ville}${t.pays ? ' · ' + t.pays : ''}</span></button>`).join('');
  boite.hidden = false;
  boite.querySelectorAll('button').forEach(b => b.onmousedown = e => {
    e.preventDefault();
    champIcao.value = b.dataset.oaci;
    fermerPropositions();
  });
});
champIcao.addEventListener('blur', () => {
  // Un code IATA laissé tel quel (3 lettres) se traduit en OACI.
  const v = champIcao.value.trim().toUpperCase();
  if (/^[A-Z]{3}$/.test(v) && chargerAnnuaire() && parIata[v]) champIcao.value = parIata[v];
  setTimeout(fermerPropositions, 150);
});

function nomDeFichier(f) {
  let icao = $('icao').value.trim().toUpperCase();
  // Ceinture et bretelles : si le blur n'est pas passé, l'IATA se traduit ici.
  if (/^[A-Z]{3}$/.test(icao) && chargerAnnuaire() && parIata[icao]) icao = parIata[icao];
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const ts = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/heic': 'heic', 'image/webp': 'webp' }[f.type] || 'jpg';
  return `${/^[A-Z]{4}$/.test(icao) ? icao : 'fiche'}_${ts}.${ext}`;
}

/* ---------- l'envoi ---------- */
$('btn-envoyer').onclick = () => {
  if (!photo) return;
  if (!navigator.onLine) { erreur('err-apercu', 'Pas de réseau — la photo reste à l\'écran, réessaie une fois connecté.'); return; }
  const nom = nomDeFichier(photo);
  montrer('ecran-envoi');
  $('envoi-detail').textContent = `Envoi de ${nom}…`;
  $('progression').style.width = '0%';

  /* XMLHttpRequest plutôt que fetch : c'est lui qui sait dire où en est
     l'ENVOI (upload.onprogress), et une photo sur réseau mobile mérite
     une vraie barre. */
  const xhr = new XMLHttpRequest();
  xhr.open('POST', CFG.serveur + '/api/fiches');
  xhr.setRequestHeader('x-fiches-token', CFG.jeton);
  xhr.setRequestHeader('x-fiches-nom', nom);
  xhr.setRequestHeader('Content-Type', photo.type || 'application/octet-stream');
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) $('progression').style.width = Math.round(100 * e.loaded / e.total) + '%';
  };
  xhr.onerror = () => rate('Le serveur relais est injoignable — réseau coupé ou serveur arrêté.');
  xhr.ontimeout = () => rate('L\'envoi a pris trop de temps — réseau trop faible, réessaie.');
  xhr.timeout = 120000;
  xhr.onload = () => {
    if (xhr.status === 201) {
      let final = nom;
      try { final = JSON.parse(xhr.responseText).nom; } catch { /* on garde le nom local */ }
      $('journal').insertAdjacentHTML('afterbegin', `<li>${final}</li>`);
      $('fait-detail').textContent = `${final} — le PC la rangera dans OneDrive/Documents/Fiches approche d'ici une dizaine de minutes.`;
      $('icao').value = '';
      photo = null;
      montrer('ecran-fait');
    } else if (xhr.status === 403) {
      rate('Jeton refusé — vérifie-le dans ⚙, il doit être identique à FICHES_TOKEN sur le serveur.');
    } else {
      let detail = '';
      try { detail = ' — ' + JSON.parse(xhr.responseText).error; } catch { /* corps illisible */ }
      rate(`HTTP ${xhr.status}${detail}`);
    }
  };
  xhr.send(photo);

  function rate(msg) {
    montrer('ecran-apercu');
    erreur('err-apercu', 'Échec de l\'envoi : ' + msg + ' La photo est toujours là.');
  }
};

demarrer();
</script>
</body>
</html>
