<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- CSP : page de redirection, elle ne charge rien d'autre qu'elle-même. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=./notam-filter.html">
<title>Preflight Lens</title>
</head>
<body>
<!-- La requête et le fragment suivent : le domaine nu est l'adresse par
     laquelle le module Minimas revient (?view=…&dep&dest&altn), et une
     redirection qui les perdait déposait le pilote sur un accueil vierge. -->
<script>window.location.replace("./notam-filter.html" + location.search + location.hash);</script>
</body>
</html>
